<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Agents</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#17171a;--dim:#77777d;--soft:#f3f3f1;--line:rgba(0,0,0,.09);--red:#e5432d;--top:calc(max(10px,env(safe-area-inset-top)) + 44px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.feed{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--bg)}
/* barra de arriba */
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 0;background:#fff;border-bottom:1px solid var(--line)}
.top b{font-weight:700;font-size:19px}
.top span{margin-left:auto;padding:6px 11px;border-radius:12px;background:var(--red);color:#fff;font-weight:600;font-size:13.5px}
.rail{position:fixed;z-index:20;right:5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px}
.rail i{display:block;width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.18)}.rail i.on{height:20px;background:var(--ink)}.rail i.need{background:var(--red)}
/* intro */
.intro{display:flex;flex-direction:column;align-items:center;padding:calc(var(--top) + 14px) 20px calc(18px + env(safe-area-inset-bottom))}
.intro .eye{width:min(62vw,300px);margin-top:4px}
.intro h1{font-weight:700;font-size:clamp(34px,10vw,52px);line-height:1;margin-top:6px;text-align:center}
.intro .sub{color:var(--dim);font-size:16px;margin-top:6px;text-align:center}
.who{width:100%;max-width:440px;margin-top:16px}
.who button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:17px;font-weight:500}
.who .dot{width:30px;height:30px;border-radius:50%;flex:none}
.who em{margin-left:auto;font-style:normal;font-weight:600;font-size:13px;padding:4px 9px;border-radius:10px;background:var(--soft);color:var(--dim)}
.who em.n{background:var(--red);color:#fff}.who em.r{background:var(--ink);color:#fff}
.dl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:8px;font-size:14px;color:var(--dim)}.dl b{color:var(--ink);font-weight:700}
.ask{margin-top:12px;border:0;border-radius:16px;padding:12px 22px;background:#1b1a17;color:#f3e3b5;font-weight:600;font-size:16px;cursor:pointer}
.hint{margin-top:auto;color:var(--dim);font-size:14px;font-weight:500}
/* tarjeta de agente */
.ag{--c:#888}
.meta{position:absolute;z-index:6;top:calc(var(--top) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--dim)}
.tabs{position:absolute;z-index:7;top:calc(var(--top) + 28px);left:16px;right:16px;display:flex;border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;font-size:15px}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c)}
.tabs button b{display:inline-block;min-width:19px;height:19px;margin-left:4px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:19px;font-weight:600}
.strip{position:absolute;top:calc(var(--top) + 72px);left:0;right:0;bottom:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;height:100%;scroll-snap-align:start;overflow-y:auto;padding:6px 20px calc(24px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-direction:column;align-items:center}
.hero .eye{width:min(50vw,230px);cursor:pointer;touch-action:manipulation}
.hero h2{font-weight:700;font-size:clamp(36px,11vw,56px);line-height:1;margin-top:2px}
.chip{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:11px;font-weight:600;font-size:13.5px;color:#fff}
.lbl{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
.needs li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:#fdecea;color:#5a1a12;font-size:16.5px;line-height:1.3;font-weight:500}
.needs li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;line-height:26px;text-align:center;font-weight:600}
.clear{padding:14px;border-radius:16px;background:var(--soft);color:var(--dim);font-size:16px}
.mini{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.mini i{width:34px;height:34px;border-radius:50%;flex:none}
.mini h3{font-weight:700;font-size:28px}
.now{font-size:21px;line-height:1.3;font-weight:500;margin-top:6px}
.steps li{list-style:none;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16.5px;line-height:1.3}
.steps li:first-child{border-top:0}
.steps li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;line-height:24px;text-align:center;font-weight:600}
.steps.next li::before{content:"→";background:var(--soft);color:var(--ink)}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:16.5px}
.facts div:first-child{border-top:0}
.facts dt{color:var(--dim)}.facts dd{font-weight:600;text-align:right}
.btn{display:block;margin-top:16px;padding:15px;border-radius:16px;background:var(--ink);color:#fff;text-align:center;font-weight:600;font-size:16px;text-decoration:none}
.note{margin-top:14px;color:var(--dim);font-size:13px;line-height:1.4}
.say{position:fixed;z-index:9;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(320px,84vw);padding:10px 15px;border-radius:18px;background:var(--ink);color:#fff;font-size:15.5px;line-height:1.3;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.say.on{opacity:1}
@media (prefers-reduced-motion:reduce){.say{transition:none}}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{border:0;border-radius:14px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer}
.acts .talk{background:var(--c);color:#fff}
.acts .sty{background:var(--soft);color:var(--ink)}
/* chat */
.chat{position:fixed;left:0;right:0;bottom:0;height:57dvh;z-index:30;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.1);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1.05,.3,1)}
.chat.on{transform:none}
.ch-h{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.ch-h .eye{width:64px;flex:none}
.ch-h b{font-weight:700;font-size:21px;display:block}
.ch-h small{color:var(--dim);font-size:13px}
.ch-h .snd{margin-left:auto}.ch-h #chX{margin-left:0}
.ch-h button{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:18px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:10px 14px;border-radius:18px;font-size:16.5px;line-height:1.35;white-space:pre-line}
.m.a{align-self:flex-start;background:var(--tint);color:var(--ink);border-bottom-left-radius:6px}
.m.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.m a{color:inherit;font-weight:600}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 14px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer}
.ch-in{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ch-in input{flex:1;min-width:0;border:0;outline:0;background:var(--soft);border-radius:20px;padding:12px 16px;font:500 16px Fredoka,sans-serif;color:var(--ink)}
.ch-in button{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:20px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.chat{transition:none}}
.cd{display:inline-block;margin:6px 0 0 6px;padding:4px 11px;border-radius:11px;font-weight:600;font-size:13.5px;background:var(--soft);color:var(--ink)}
.cd.hot{background:var(--red);color:#fff}
.needs li{cursor:pointer}.needs li i{margin-left:auto;font-style:normal;color:#b0402f;font-size:13px;font-weight:600;white-space:nowrap;align-self:center}
.byyou li{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:8px;border-radius:16px;background:#e5f6ec;color:#14532d;font-size:15.5px;line-height:1.3}
.byyou li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:#1d9e6a;color:#fff;text-align:center;line-height:24px;font-size:13px;font-weight:600}
.byyou small{display:block;color:#3f7a57;font-size:13px}
.byyou button{margin-left:auto;border:0;background:none;color:#3f7a57;font-weight:600;font-size:13px;cursor:pointer}
.btn.ghost{background:#25d366;color:#06301a}
.tool{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:6px}
.wr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.wr:first-child{border-top:0}
.wr i{font-style:normal;font-weight:700;color:var(--dim);min-width:26px}
.wr button{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr button.win{background:var(--c);border-color:var(--c);color:#fff}
.score{font-size:19px;font-weight:600;margin-top:4px}.score small{display:block;color:var(--dim);font-size:13.5px;font-weight:500}
.mform{display:grid;grid-template-columns:1fr 92px;gap:8px}
.mform input,.mform select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:500 16px Fredoka,sans-serif;background:#fff;color:var(--ink);min-width:0}
.mform button{grid-column:1/-1;border:0;border-radius:12px;padding:12px;background:var(--c);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.mrow b{margin-left:auto}.mrow em{font-style:normal;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:8px;cursor:pointer}
.mrow em.paid{background:#e5f6ec;color:#14532d}.mrow em.owed{background:#fdecea;color:#9b2c1d}
.mrow button{border:0;background:none;color:var(--dim);font-size:16px;cursor:pointer}
.tot{display:flex;gap:10px;margin:10px 0 4px}.tot div{flex:1;border-radius:14px;padding:10px 12px;background:var(--soft)}.tot small{display:block;color:var(--dim);font-size:12.5px;font-weight:600}.tot b{font-size:21px}
.today{padding:calc(var(--top) + 18px) 20px 30px;overflow-y:auto}
.today h2{font-weight:700;font-size:clamp(34px,10vw,50px);line-height:1}
.tl li{list-style:none;padding:11px 0;border-top:1px solid var(--line);font-size:16.5px;line-height:1.3}.tl li small{display:block;color:var(--dim);font-size:13px}
.sm{margin-top:10px;display:flex;gap:8px;justify-content:center}.sm button{border:0;background:none;color:var(--dim);font-size:13.5px;font-weight:600;text-decoration:underline;cursor:pointer}
/* hoja para contestar una necesidad */
.ns{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1.05,.3,1);max-height:88dvh;overflow-y:auto}
.ns.on{transform:none}
.ns h3{font-weight:700;font-size:15px;color:var(--dim);display:flex;align-items:center;gap:8px}
.ns h3 button{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:16px;cursor:pointer}
.ns p.q{font-size:21px;font-weight:600;line-height:1.25;margin:8px 0 12px;color:#5a1a12}
.ns textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:500 16px Fredoka,sans-serif;resize:vertical;color:var(--ink)}
.ns .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ns .row>*{flex:1;border:0;border-radius:14px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;text-align:center}
.ns .ph{background:var(--soft)}.ns .ok{background:#1d9e6a;color:#fff}.ns .cl{background:var(--ink);color:#fff}
.ns img{display:block;max-width:100%;max-height:180px;border-radius:12px;margin-top:10px}
.ns .tip{color:var(--dim);font-size:12.5px;margin-top:10px}
.mic{width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);font-size:19px;cursor:pointer;flex:none}.mic.rec{background:var(--red);color:#fff}
/* PIN */
.lock{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock.on{display:flex}
.lock h2{font-weight:700;font-size:28px}.lock p{color:var(--dim);margin-top:6px;max-width:300px}
.lock input{margin-top:18px;width:200px;text-align:center;font:600 28px Fredoka,sans-serif;letter-spacing:.4em;border:2px solid var(--line);border-radius:16px;padding:12px}
.lock .lb2{display:flex;gap:8px;margin-top:14px}.lock .lb2 button{border:0;border-radius:14px;padding:12px 20px;font-weight:600;font-size:16px;cursor:pointer;background:var(--ink);color:#fff}.lock .lb2 button.x{background:var(--soft);color:var(--ink)}
.lock .err{color:var(--red);height:20px;margin-top:8px;font-weight:600}
@media (prefers-reduced-motion:reduce){.ns{transition:none}}
.holdtip{position:fixed;z-index:40;left:50%;top:calc(var(--top) + 14px);transform:translateX(-50%);padding:9px 16px;border-radius:16px;background:var(--red);color:#fff;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.holdtip.on{opacity:1}
.ag .hint2{color:var(--dim);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="feed" id="feed"></div>
<header class="top"><b>Agents</b><span id="pk"></span></header>
<nav class="rail" id="rail" aria-hidden="true"></nav>
<div class="say" id="say"></div><div class="holdtip" id="holdtip">Listening… let go to send</div>
<div class="ns" id="ns" role="dialog" aria-label="Answer"><h3><i id="nsDot" style="width:22px;height:22px;border-radius:50%;display:inline-block"></i><span id="nsName"></span><button id="nsX" aria-label="Close">✕</button></h3>
 <p class="q" id="nsQ"></p><textarea id="nsNote" placeholder="Your answer or a note (optional)"></textarea>
 <img id="nsImg" alt="" hidden>
 <div class="row"><label class="ph">📷 Add photo<input type="file" id="nsFile" accept="image/*" hidden></label><button class="cl" id="nsCopy">Copy for Claude</button></div>
 <div class="row"><button class="ok" id="nsOk">Mark done ✓</button></div>
 <p class="tip">Marking it done saves it on this phone. Photos stay on your phone; send them to Claude in the chat.</p></div>
<div class="lock" id="lock"><h2 id="lkT">Enter PIN</h2><p id="lkP">This board is locked on this phone.</p><input id="lkIn" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><div class="err" id="lkE"></div><div class="lb2"><button class="x" id="lkX" hidden>Cancel</button><button id="lkGo">Open</button></div></div>
<div class="chat" id="chat" role="dialog" aria-label="Chat"><div class="ch-h"><div><b id="chName"></b><small id="chSub"></small></div><button id="snd" class="snd" aria-label="Voice on or off">🔊</button><button id="chX" aria-label="Close">✕</button></div>
<div class="msgs" id="msgs"></div><div class="quick" id="quick"></div>
<form class="ch-in" id="chForm" autocomplete="off"><button type="button" class="mic" id="mic" aria-label="Talk">🎤</button><input id="chQ" placeholder="Message" enterkeyhint="send"><button aria-label="Send">↑</button></form></div>
<script type="module">
/* Datos: agents.json (lo actualizo yo); si falla, se usa la copia de abajo. */
let D;try{const r=await fetch('agents.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;D=await r.json()}catch(e){D=FALLBACK}
const AG=D.agents;const DL=D.deadlines.slice().sort((a,b)=>a.date<b.date?-1:1);const RACES=D.races||[];
const ST={needs:['needs you','#e5432d'],run:['working','#17171a'],idle:['not started','#9a9aa0']};
const $=s=>document.querySelector(s);const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const mix=(a,b,t)=>a.map((v,i)=>Math.round(lerp(v,b[i],t)));const css=c=>`rgb(${c})`;
const shade=(h,k)=>css(k<0?mix(hex(h),[0,0,0],-k):mix(hex(h),[255,255,255],k));

/* ---------- estado guardado en este teléfono ---------- */
const SK='agents-state-1';const S={done:{},money:[],winners:{},pin:''};try{Object.assign(S,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
const nk=(a,t)=>a.id+'|'+t;
const openNeeds=a=>a.needs.filter(t=>!S.done[nk(a,t)]);
const doneByYou=a=>a.needs.filter(t=>S.done[nk(a,t)]);
const totalOpen=()=>AG.reduce((n,a)=>n+openNeeds(a).length,0);
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=d=>{const t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((new Date(d+'T00:00:00')-t)/864e5))};
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const ORACLE={id:'oracle',name:'The Oracle',color:'#b8892b',needs:[],st:'run'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- estilos de ojo ---------- */
const STYLES=['bubble','cat','robot','googly','lashes','horus','nazar','mexica','buddha','odin'];
const STY_NAME={bubble:'Bubble',cat:'Cat',robot:'Robot',googly:'Googly',lashes:'Lashes',horus:'Horus (Egypt)',nazar:'Nazar (Greece)',mexica:'Mexica (Aztec)',buddha:'Buddha (Nepal)',odin:'Odin (Norse)'};
const DEF={flyers:'mexica',ads:'nazar',hipiq:'horus',valley:'googly',results:'odin',money:'lashes',caos:'buddha'};
let saved={};try{saved=JSON.parse(localStorage.getItem('agent-eye-styles-2')||'{}')}catch(e){}
const styleOf=a=>saved[a.id]||DEF[a.id]||'bubble';
const saveStyles=()=>{try{localStorage.setItem('agent-eye-styles-2',JSON.stringify(saved))}catch(e){}};
const toHex=c=>c[0]==='#'?c:'#'+c.match(/\d+/g).map(v=>(+v).toString(16).padStart(2,'0')).join('');
const RUNES='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';

/* ---------- personaje: burbuja con ojo ---------- */
let EID=0;
function eyeSVG(o){const k=EID++;const ora=!!o.ball;const sty=ora?'oracle':(o.style||'bubble');
 const ex=200,ey=ora?200:188,er=ora?150:(sty==='googly'?100:88);
 const ir=ora?78:({cat:62,horus:52,nazar:60,mexica:52,buddha:46,odin:50}[sty]||50);
 const lid=ora?'#ebe2c8':o.color;
 const fibers=(r,n=48,op=.26)=>{let f='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r1=r*.44,r2=r*.9;f+=`<line x1="${(Math.cos(a)*r1).toFixed(1)}" y1="${(Math.sin(a)*r1).toFixed(1)}" x2="${(Math.cos(a)*r2).toFixed(1)}" y2="${(Math.sin(a)*r2).toFixed(1)}" stroke="${i%2?'#fff':'#000'}" stroke-opacity="${op}" stroke-width="${i%3?1.3:2}" stroke-linecap="round"/>`}return f};
 const base=ora?'#14625e':(o.color==='#2a2a2e'?'#6b6b73':o.color);
 const irisC={cat:'#c9b52a',lashes:toHex(shade(base,-.25)),horus:'#3a2412',mexica:'#1f8a70',buddha:'#1d3a5f',odin:'#7d97a8',oracle:'#14625e'}[sty]||base;
 const hl=`<ellipse cx="${-ir*.3}" cy="${-ir*.35}" rx="${ir*.2}" ry="${ir*.15}" fill="#fff" opacity=".92" transform="rotate(-30 ${-ir*.3} ${-ir*.35})"/><circle cx="${ir*.28}" cy="${ir*.28}" r="${ir*.07}" fill="#fff" opacity=".7"/>`;
 const std=`<circle r="${ir}" fill="url(#ir${k})"/>${fibers(ir)}<circle r="${ir}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="4"/><circle class="pu" r="${ir*.36}" fill="#0d0d10"/>${hl}`;
 let iris=std,white=`<circle cx="${ex}" cy="${ey}" r="${er}" fill="url(#ew${k})"/>`,deco='',over='';
 if(sty==='robot'){iris=`<g class="rg" data-spin="40"><circle r="54" fill="none" stroke="${shade(base,.25)}" stroke-width="7" stroke-dasharray="20 8"/></g><circle r="36" fill="none" stroke="${shade(base,.55)}" stroke-width="4"/><circle class="pu" r="16" fill="${shade(base,.6)}"/><rect x="-26" y="-3" width="52" height="6" rx="3" fill="${shade(base,.6)}" opacity=".5"/>`;
  white=`<circle cx="${ex}" cy="${ey}" r="${er}" fill="#15171c"/><circle cx="${ex}" cy="${ey}" r="${er-6}" fill="none" stroke="#2b2e36" stroke-width="3"/>`}
 else if(sty==='googly')iris=`<circle class="pu" r="40" fill="#111"/><circle cx="-12" cy="-13" r="8" fill="#fff" opacity=".85"/>`;
 else if(sty==='cat')iris=`<circle r="${ir}" fill="url(#ir${k})"/>${fibers(ir)}<circle r="${ir}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="4"/><ellipse class="pu" rx="${ir*.18}" ry="${ir*.86}" fill="#0d0d10"/>${hl}`;
 else if(sty==='nazar'){ // cuenta de vidrio azul contra el mal de ojo
  iris=`<circle r="60" fill="#0b3a8c"/><circle r="45" fill="#fdfdfd"/><circle r="32" fill="#59b4ea"/><circle class="pu" r="15" fill="#0b0b0e"/><ellipse cx="-20" cy="-26" rx="14" ry="9" fill="#fff" opacity=".85" transform="rotate(-30 -20 -26)"/>`}
 else if(sty==='mexica'){ // piedra del sol: rayos dorados, mosaico de turquesa, iris de jade escalonado
  let rays='';for(let i=0;i<16;i++){const a=i/16*Math.PI*2+Math.PI/16,w=.11;const p=(r,aa)=>`${(ex+Math.cos(aa)*r).toFixed(1)},${(ey+Math.sin(aa)*r).toFixed(1)}`;rays+=`<polygon points="${p(96,a-w)} ${p(126,a)} ${p(96,a+w)}" fill="${i%2?'#e0b23a':'#b8322a'}"/>`}
  let tiles='';for(let i=0;i<36;i++){const a=i/36*Math.PI*2;tiles+=`<rect x="${(ex+Math.cos(a)*92-4).toFixed(1)}" y="${(ey+Math.sin(a)*92-4).toFixed(1)}" width="8" height="8" rx="1.5" fill="${['#2bb3a3','#1d8c80','#47c7b8'][i%3]}" transform="rotate(${(a*180/Math.PI).toFixed(1)} ${(ex+Math.cos(a)*92).toFixed(1)} ${(ey+Math.sin(a)*92).toFixed(1)})"/>`}
  deco=rays+tiles;
  let steps='';for(let i=0;i<12;i++){const a=i*30;steps+=`<path d="M38 -6 h7 v-6 h7 v24 h-7 v-6 h-7z" fill="#0f5c4a" transform="rotate(${a})"/>`}
  iris=`<circle r="${ir}" fill="url(#ir${k})"/>${steps}<circle r="${ir}" fill="none" stroke="#0b3d33" stroke-width="4"/><circle class="pu" r="${ir*.36}" fill="#0d0d10"/>${hl}`}
 else if(sty==='horus'){ // Udjat: delineado, ceja, lágrima y espiral
  const k2=`stroke="#141414" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  over=`<path d="M${ex-er-14} ${ey} Q${ex} ${ey-er-34} ${ex+er+16} ${ey-4} L${ex+er+58} ${ey-10}" ${k2} stroke-width="11"/>
   <path d="M${ex-er-14} ${ey} Q${ex} ${ey+er+30} ${ex+er+16} ${ey-4}" ${k2} stroke-width="9"/>
   <path d="M${ex-er-8} ${ey-er-22} Q${ex+6} ${ey-er-58} ${ex+er+40} ${ey-er-24}" ${k2} stroke-width="15"/>
   <path d="M${ex-6} ${ey+er+6} L${ex-12} ${ey+er+52}" ${k2} stroke-width="11"/>
   <path d="M${ex+26} ${ey+er+4} C${ex+40} ${ey+er+44} ${ex+96} ${ey+er+40} ${ex+88} ${ey+er+14} C${ex+82} ${ey+er+2} ${ex+66} ${ey+er+12} ${ex+74} ${ey+er+22}" ${k2} stroke-width="9"/>`}
 else if(sty==='buddha'){ // ojos de la estupa: ceja curva y el rizo debajo
  const k2=`stroke="#141414" fill="none" stroke-linecap="round"`;
  over=`<path d="M${ex-er-6} ${ey-er+8} Q${ex} ${ey-er-46} ${ex+er+6} ${ey-er+8}" ${k2} stroke-width="11"/>
   <path d="M${ex+4} ${ey+er+8} C${ex+30} ${ey+er+10} ${ex+30} ${ey+er+40} ${ex+4} ${ey+er+40} C${ex-18} ${ey+er+40} ${ex-16} ${ey+er+20} ${ex-2} ${ey+er+22}" ${k2} stroke-width="9"/>`}
 else if(sty==='odin'){ // anillo de runas que gira
  deco=`<defs><path id="rp${k}" d="M${ex} ${ey-110} a110 110 0 1 1 -0.1 0"/></defs><circle cx="${ex}" cy="${ey}" r="${er+6}" fill="none" stroke="#1d2530" stroke-width="5"/>
   <g class="rg" data-spin="10" data-cx="${ex}" data-cy="${ey}"><circle cx="${ex}" cy="${ey}" r="118" fill="none" stroke="#1d2530" stroke-width="22" stroke-opacity=".75"/><text font-size="17" fill="#e8d9a8" letter-spacing="3"><textPath href="#rp${k}">${RUNES}${RUNES.slice(0,4)}</textPath></text></g>`}
 else if(sty==='oracle'){ // el Oráculo: iris grabado en oro y órbita de signos
  iris=`<circle r="${ir}" fill="url(#ir${k})"/>${fibers(ir,64,.22)}<g class="rg" data-spin="-14"><circle r="${ir*.72}" fill="none" stroke="#e2b54a" stroke-width="2.5" stroke-dasharray="3 7"/></g><circle r="${ir}" fill="none" stroke="#c99a2e" stroke-width="5"/><circle r="${ir-9}" fill="none" stroke="#e2b54a" stroke-width="1.5" stroke-opacity=".7"/><ellipse class="pu" rx="${ir*.2}" ry="${ir*.5}" fill="#08100f"/>${hl}`;
  let marks='';for(let i=0;i<48;i++){const a=i/48*Math.PI*2,r1=i%4?172:166;marks+=`<line x1="${(200+Math.cos(a)*r1).toFixed(1)}" y1="${(200+Math.sin(a)*r1).toFixed(1)}" x2="${(200+Math.cos(a)*178).toFixed(1)}" y2="${(200+Math.sin(a)*178).toFixed(1)}" stroke="#b8892b" stroke-width="${i%4?1.5:3}"/>`}
  let glyph='';['☉','☽','△','◇','✶','☿','♄','♃'].forEach((g,i)=>{const a=i/8*Math.PI*2-Math.PI/2;glyph+=`<text x="${(200+Math.cos(a)*190).toFixed(1)}" y="${(200+Math.sin(a)*190+6).toFixed(1)}" font-size="17" fill="#8a6418" text-anchor="middle">${g}</text>`});
  over='';deco='';o.orbit=`<g class="rg2" data-spin="5" data-cx="200" data-cy="200"><circle cx="200" cy="200" r="178" fill="none" stroke="#b8892b" stroke-width="1.5"/>${marks}${glyph}</g>`;
  white=''}
 const fill0=ora?'#fff':shade(o.color,.42),fill1=ora?'#f4efe2':o.color,fill2=ora?'#cbbd97':shade(o.color,-.38);
 return `<svg class="eye" viewBox="${ora?'-10 -10 420 450':'0 0 400 430'}" data-sty="${sty}" data-ex="${ex}" data-ey="${ey}" data-er="${er}" data-mr="${ora?60:sty==='googly'?0:34}">
 <defs><radialGradient id="bd${k}" cx=".38" cy=".3" r=".78"><stop offset="0" stop-color="${fill0}"/><stop offset=".6" stop-color="${fill1}"/><stop offset="1" stop-color="${fill2}"/></radialGradient>
 <radialGradient id="ew${k}" cx=".42" cy=".36" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".8" stop-color="#f1f2f4"/><stop offset="1" stop-color="#cfd3da"/></radialGradient>
 <radialGradient id="ir${k}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${shade(irisC,.45)}"/><stop offset=".55" stop-color="${irisC}"/><stop offset=".86" stop-color="${shade(irisC,-.3)}"/><stop offset="1" stop-color="${shade(irisC,-.6)}"/></radialGradient>
 <radialGradient id="gn${k}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="cp${k}"><circle cx="${ex}" cy="${ey}" r="${er}"/></clipPath></defs>
 <ellipse class="sh" cx="200" cy="${ora?425:405}" rx="115" ry="15" fill="url(#gn${k})"/>
 ${o.orbit||''}
 <g class="bd"><circle cx="200" cy="200" r="150" fill="url(#bd${k})"/>${deco}${white}
  <g clip-path="url(#cp${k})"><g class="ir">${iris}</g>
   <ellipse class="lt" cx="${ex}" cy="${ey-er-er*1.15}" rx="${er*1.45}" ry="${er*1.15}" fill="${lid}"/><ellipse class="lb" cx="${ex}" cy="${ey+er+er*1.15}" rx="${er*1.45}" ry="${er*1.15}" fill="${lid}"/></g>
  ${over}
  ${sty==='googly'?`<ellipse cx="${ex-34}" cy="${ey-46}" rx="30" ry="16" fill="#fff" opacity=".75" transform="rotate(-30 ${ex-34} ${ey-46})"/><circle cx="${ex}" cy="${ey}" r="${er}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="3"/>`:''}
  ${sty==='lashes'?`<g class="lash">${[-62,-38,-12,14,40,64].map(x=>{const rx=er*1.45,ry=er*1.15,y=ry*(Math.sqrt(1-(x/rx)**2)-1);return `<line x1="${200+x}" y1="${y.toFixed(1)}" x2="${(200+x*1.3).toFixed(1)}" y2="${(y-26).toFixed(1)}" stroke="#1b1b1f" stroke-width="7" stroke-linecap="round"/>`}).join('')}</g>`:''}
  <ellipse cx="135" cy="105" rx="62" ry="36" fill="#fff" opacity="${ora?.75:.38}" transform="rotate(-35 135 105)"/>
  <path d="M90 275 A150 150 0 0 0 310 275" fill="none" stroke="#fff" stroke-opacity="${ora?.55:.25}" stroke-width="7" stroke-linecap="round"/></g></svg>`}


/* ---------- tarjetas ---------- */

const nextDL=a=>DL.find(d=>d.ag===a.id&&!d.wait&&daysTo(d.date)>0);
let html=`<section class="card intro" id="intro">${eyeSVG({ball:true})}
 <h1>The Oracle</h1><p class="sub" id="oSub"></p><p class="dl">${DL.map(d=>`<span><b>${daysTo(d.date)}</b> days${d.wait?' till':' to'} ${d.what}</span>`).join('')}</p><button class="ask" id="askOracle">Ask the Oracle</button>
 <div class="who">${AG.map((a,i)=>`<button data-go="${i}"><i class="dot" style="background:${dotBg(a.color)}"></i>${a.name}<em id="who-${i}"></em></button>`).join('')}</div>
 <div class="sm"><button id="pinBtn"></button><button id="homeBtn">Add to home screen</button></div></section>`;
html+=AG.map((a,i)=>{const [lbl,col]=ST[a.st];const li=(x,cls)=>x.length?`<ul class="${cls}">${x.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:`<p class="clear">Nothing yet</p>`;const d=nextDL(a);
 return `<section class="card ag" style="--c:${a.color}" data-i="${i}">
 <div class="meta"><span>Agent ${i+1} of ${AG.length}</span><span>${lbl}</span></div>
 <div class="tabs"><button class="on">Needs<b id="bd-${i}"></b></button><button>Doing</button><button>Important</button></div>

   <p class="hint2">Tap the eye to chat · hold it to talk</p><div class="acts"><button class="talk" data-talk="${i}">Talk</button><button class="sty" data-estilo="${i}">Eye: ${STY_NAME[styleOf(a)]} ↻</button></div></div>
   <p class="lbl">Needs from you · tap one to answer</p><div id="nd-${i}"></div></div>
  <div class="panel"><div class="mini"><i style="background:${dotBg(a.color)}"></i><h3>${a.name}</h3></div>

   <p class="lbl">Done</p>${li(a.done,'steps')}
   <p class="lbl">Up next</p>${li(a.next,'steps next')}</div>
  <div class="panel"><div class="mini"><i style="background:${dotBg(a.color)}"></i><h3>${a.name}</h3></div>
   ${a.job==='results'?`<p class="lbl">Race day · tap each winner</p><div class="tool" id="job-results"></div>`:''}
   ${a.job==='money'?`<p class="lbl">Payments</p><div class="tool" id="job-money"></div>`:''}
   <p class="lbl">Important</p><dl class="facts">${a.facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
   ${a.link?`<a class="btn" href="${a.link[1]}">${a.link[0]}</a>`:''}
   <button class="btn ghost" style="width:100%;border:0;cursor:pointer" data-share="${i}">Share this card on WhatsApp</button>
   <p class="note">Updated ${fmtD(D.updated)}. Answers you mark done are saved on this phone.</p></div>
 </div></section>`}).join('');
html+=`<section class="card today" id="today"><p class="lbl" style="margin-top:0">Done today</p><h2 id="tdH"></h2><div id="tdL"></div></section>`;
feed.innerHTML=html;
const cards=[...feed.querySelectorAll('.card')];
const agCard=i=>feed.querySelector(`.ag[data-i="${i}"]`);
const goCard=el=>feed.scrollTo({top:el.offsetTop,behavior:'smooth'});

document.querySelectorAll('.ag').forEach(c=>{const strip=c.querySelector('.strip'),tabs=[...c.querySelectorAll('.tabs button')];
 tabs.forEach((t,i)=>t.addEventListener('click',()=>strip.scrollTo({left:i*strip.clientWidth,behavior:'smooth'})));
 let raf;strip.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=Math.round(strip.scrollLeft/strip.clientWidth);tabs.forEach((t,j)=>t.classList.toggle('on',i===j))})},{passive:true})});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goCard(agCard(+b.dataset.go))));

const railEl=$('#rail');railEl.innerHTML=cards.map(()=>'<i></i>').join('');
function rail(){const i=Math.round(feed.scrollTop/innerHeight);[...railEl.children].forEach((m,j)=>m.classList.toggle('on',i===j))}
feed.addEventListener('scroll',rail,{passive:true});rail();
let sayT;function say(t,ms=3200){const s=$('#say');s.textContent=t;s.classList.add('on');clearTimeout(sayT);sayT=setTimeout(()=>s.classList.remove('on'),ms)}

/* ---------- pintar números y listas ---------- */
function paint(){const tot=totalOpen();
 $('#pk').textContent=tot?`${tot} thing${tot>1?'s':''} need you`:'All clear ✓';$('#pk').style.background=tot?'':'#1d9e6a';
 $('#oSub').textContent=`Watches ${AG.length} agents · ${tot} things need you`;
 AG.forEach((a,i)=>{const o=openNeeds(a),dn=doneByYou(a);
  const w=$('#who-'+i);w.className=o.length?'n':'';w.textContent=o.length?`${o.length} need you`:'all clear';
  const b=$('#bd-'+i);b.textContent=o.length||'';b.style.display=o.length?'':'none';
  $('#nd-'+i).innerHTML=(o.length?`<ul class="needs">${o.map(t=>`<li data-need="${i}" data-t="${esc(t)}"><b>${a.needs.indexOf(t)+1}</b><span>${esc(t)}</span><i>answer ›</i></li>`).join('')}</ul>`:'<p class="clear">Nothing right now. All clear ✓</p>')
   +(dn.length?`<p class="lbl">Done by you</p><ul class="byyou">${dn.map(t=>{const r=S.done[nk(a,t)];return `<li><span>${esc(t)}${r.note?`<small>${esc(r.note)}</small>`:''}</span><button data-undo="${i}" data-t="${esc(t)}">undo</button></li>`}).join('')}</ul>`:'');
  const E=eyes.find(E=>E.svg.closest('.ag')===agCard(i));if(E)E.droop=a.needs.length?.42*o.length/a.needs.length:0;
  railEl.children[i+1].classList.toggle('need',o.length>0)});
 paintResults();paintMoney();paintToday();if(typeof moods==='function'&&eyes.length)moods()}

/* contestar una necesidad */
let nsCur=null;
feed.addEventListener('click',e=>{const n=e.target.closest('[data-need]');if(n){openNeed(+n.dataset.need,n.dataset.t);return}
 const u=e.target.closest('[data-undo]');if(u){const a=AG[+u.dataset.undo];delete S.done[nk(a,u.dataset.t)];save();paint();return}
 const sh=e.target.closest('[data-share]');if(sh){const a=AG[+sh.dataset.share],o=openNeeds(a);
  location.href='https://wa.me/?text='+encodeURIComponent(`${a.name}\nNow: ${a.now}\n${o.length?'Needs:\n'+o.map(t=>'• '+t).join('\n'):'Nothing pending.'}`)}});
function openNeed(i,t){const a=AG[i];nsCur={a,i,t,photo:''};$('#nsDot').style.background=dotBg(a.color);$('#nsName').textContent=a.name;$('#nsQ').textContent=t;
 $('#nsNote').value='';$('#nsImg').hidden=true;$('#nsFile').value='';$('#nsCopy').textContent='Copy for Claude';$('#ns').classList.add('on')}
$('#nsX').addEventListener('click',()=>$('#ns').classList.remove('on'));
$('#nsFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;nsCur.photo=f.name;const im=$('#nsImg');im.src=URL.createObjectURL(f);im.hidden=false});
$('#nsOk').addEventListener('click',()=>{const {a,i,t,photo}=nsCur;S.done[nk(a,t)]={at:new Date().toISOString(),note:$('#nsNote').value.trim()+(photo?` (photo: ${photo})`:'')};save();$('#ns').classList.remove('on');paint();
 const E=eyes.find(E=>E.svg.closest('.ag')===agCard(i));if(E){E.sv-=.14;E.happyT=1;setTimeout(()=>E.happyT=0,1400)}
 const left=openNeeds(a).length;say(left?`Thanks! ${left} more for ${a.name}.`:`${a.name} is all clear ✓`)});
$('#nsCopy').addEventListener('click',()=>{const {a,t}=nsCur;copy(`[${a.name} agent] About: ${t}\nMy answer: ${$('#nsNote').value.trim()||'(see attached)'}`,$('#nsCopy'))});
function copy(t,btn){const done=()=>{btn.textContent='Copied ✓'};if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,fb);else fb();
 function fb(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){}ta.remove()}}

/* ---------- Results: ganadores y puntaje de mis picks ---------- */
function myPicks(){try{return JSON.parse(localStorage.getItem('gm-g2-picks')||'{}')}catch(e){return {}}}
function paintResults(){const el=$('#job-results');if(!el)return;const P=myPicks();let right=0,decided=0;
 el.innerHTML=RACES.map((r,k)=>{const n=k+1,w=S.winners[n];if(w){decided++;if(P[n]===w)right++}
  return `<div class="wr"><i>C${n}</i><button data-win="${n}" data-s="a" class="${w==='a'?'win':''}">${esc(r[0])}</button>${r[1]?`<button data-win="${n}" data-s="b" class="${w==='b'?'win':''}">${esc(r[1])}</button>`:'<button disabled>Por anunciar</button>'}</div>`}).join('')
  +`<p class="score">${Object.keys(P).length?`Your picks: ${right} of ${decided} right`:'No picks on this phone yet'}<small>${decided} of ${RACES.length} winners entered · picks made on the Gran Maturity page on this phone</small></p>`}
feed.addEventListener('click',e=>{const b=e.target.closest('[data-win]');if(!b)return;const n=b.dataset.win;S.winners[n]=S.winners[n]===b.dataset.s?undefined:b.dataset.s;if(!S.winners[n])delete S.winners[n];save();paintResults()});

 el.innerHTML=`<form class="mform" id="mf"><input name="who" placeholder="Who (sponsor, ad spot)" required><input name="amt" type="number" inputmode="decimal" placeholder="Amount" required><select name="st"><option value="owed">Owes</option><option value="paid">Paid</option></select><button>Add</button></form>
  <div class="tot"><div><small>Paid</small><b>${money(paid)}</b></div><div><small>Still owed</small><b>${money(owed)}</b></div></div>
