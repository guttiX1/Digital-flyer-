<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valley Meats · Elige tu antojo</title>
<meta name="description" content="Cambia el lugar, la luz, el platillo o llena la mesa. Valley Meats, La Carnicería, Carbondale, CO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --retake-ease:cubic-bezier(0.22, 1, 0.36, 1);
  --retake-slow-ease:cubic-bezier(0.65, 0, 0.35, 1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#000;color:#fff;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
button{font-family:'Manrope',system-ui,sans-serif;color:inherit}
::selection{background:rgba(255,255,255,0.2)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
a{color:inherit;text-decoration:none}

.stage{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000}

.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;pointer-events:none;visibility:hidden}
.media.is-visible{visibility:visible}

/* hero copy */
.hero{position:absolute;inset:0;z-index:10;pointer-events:none}
.hero h1{position:absolute;top:35.9%;left:50%;transform:translateX(-50%);width:min(901px, calc(100vw - 48px));margin:0;text-align:center;font-size:clamp(62px,6.8vw,100px);font-weight:500;line-height:0.8;letter-spacing:-0.04em;white-space:nowrap;text-shadow:0 2px 12px rgb(0 0 0 / 0.14)}
.hero h1 span{display:inline-block;transition:opacity 900ms var(--retake-ease),filter 900ms var(--retake-ease),transform 900ms var(--retake-ease)}
.hero h1 span:nth-child(2){transition-delay:90ms}
.hero h1 span:nth-child(3){transition-delay:180ms}
.stage.title-hidden .hero h1 span{opacity:0;filter:blur(12px);transform:translateY(-10px)}
.hero p{position:absolute;top:calc(35.9% - 64px);left:50%;transform:translateX(-50%);width:min(734px, calc(100vw - 48px));margin:0;text-align:center;font-size:clamp(14px,1.25vw,18px);font-weight:400;line-height:1.2;letter-spacing:-0.04em;text-shadow:0 1px 8px rgb(0 0 0 / 0.16)}

/* controller */
.controller{position:absolute;top:46.78%;left:50%;transform:translateX(-50%);width:min(880px, calc(100vw - 48px));height:72px;z-index:20;--glass-x:24%;--glass-y:8%}
.glass{position:absolute;border-radius:999px}
.glass::before,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.glass::before{background:radial-gradient(120% 150% at var(--glass-x,24%) var(--glass-y,8%), rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%)}
.glass::after{padding:1px;background:conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff, #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.track{top:4px;left:0;width:100%;height:64px;pointer-events:none;
  background:rgb(24 55 82 / 0.31);border:1px solid rgb(255 255 255 / 0.2);
  -webkit-backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);
  backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);
  box-shadow:0 14px 38px rgb(4 24 43 / 0.16),0 2px 7px rgb(4 24 43 / 0.1),inset 1px 1px 0 rgb(255 255 255 / 0.48),inset -1px -1px 0 rgb(21 49 73 / 0.14),inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
  transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),top 980ms var(--retake-slow-ease),height 980ms var(--retake-slow-ease),opacity 400ms linear}
.track::after{opacity:0.27}

.capsule{top:-1px;height:72px;pointer-events:none;left:var(--cap-left, -5px);width:var(--cap-width, calc(20% + 5px));
  background:rgb(246 251 255 / 0.24);border:1px solid rgb(255 255 255 / 0.28);
  -webkit-backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);
  backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);
  box-shadow:0 11px 28px rgb(4 24 43 / 0.17),0 2px 6px rgb(4 24 43 / 0.1),inset 1px 1px 0 rgb(255 255 255 / 0.62),inset -1px -1px 0 rgb(20 49 73 / 0.18),inset 0 0 12px rgb(255 255 255 / 0.055);
  transition:left 620ms var(--retake-ease),width 620ms var(--retake-ease),background-color 980ms var(--retake-slow-ease)}
.capsule::after{opacity:0.30}

.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.cell{display:flex;align-items:center;justify-content:center;height:100%;padding:0 14px;font-size:23px;font-weight:400;line-height:1.2;letter-spacing:-0.04em;white-space:nowrap;
  transition:opacity 420ms var(--retake-ease),filter 420ms var(--retake-ease),transform 980ms var(--retake-slow-ease)}
button.cell{background:transparent;border:0;border-radius:999px;cursor:pointer;margin:0}
button.cell:disabled{cursor:default}
.cell.label{transition:opacity 300ms var(--retake-ease),filter 420ms var(--retake-ease),transform 980ms var(--retake-slow-ease)}
.controller.highlighting .cell.label{opacity:0.5}

/* collapsed (forward + selected) */
.controller.collapsed .capsule{left:calc(50% - 100px);width:200px;background-color:rgb(246 251 255 / 0.14);transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),background-color 980ms var(--retake-slow-ease)}
.controller.collapsed .track{left:calc(50% - 96px);width:192px}
.controller.track-fade .track{opacity:0;transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),top 980ms var(--retake-slow-ease),height 980ms var(--retake-slow-ease),opacity 400ms linear 650ms}
.controller.collapsed .cell:not(.chosen){opacity:0;filter:blur(10px);transform:scale(0.94);pointer-events:none}
.controller.restoring .cell:not(.chosen){transition:opacity 760ms var(--retake-ease) 60ms,filter 760ms var(--retake-ease) 60ms,transform 980ms var(--retake-slow-ease)}
.cell.chosen .txt{display:inline-block;transition:opacity 260ms var(--retake-ease),filter 260ms var(--retake-ease)}
.cell.chosen.fading .txt{opacity:0;filter:blur(10px)}
.cell.is-reset .txt{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;animation:resetIn 520ms var(--retake-ease) both}
@keyframes resetIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}

/* header */
header{position:absolute;top:0;left:0;width:100%;z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:calc(58px + env(safe-area-inset-top)) 40px 40px;text-shadow:0 1px 6px rgb(0 0 0 / 0.18)}
.brand{display:flex;align-items:center}
.logo{display:inline-flex}
.logo svg{height:24px;width:auto;display:block}
.meta{display:flex;white-space:nowrap;margin-left:clamp(48px,5vw,70px);gap:clamp(28px,3vw,44px);font-size:18px;line-height:1.2;letter-spacing:-0.04em}
.try{grid-column:3;position:relative;display:inline-flex;align-items:center;justify-content:center;width:152px;height:38px;border-radius:999px;border:1px solid rgb(255 255 255 / 0.75);background:transparent;color:#fff;font-size:18px;letter-spacing:-0.04em;transition:color 300ms,background-color 300ms,border-color 300ms}
.try:hover,.try:focus-visible{background:#fff;color:#0b1a26;border-color:#fff}

/* status + notice */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.notice{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:999px;background:rgb(11 26 38 / 0.82);border:1px solid rgb(255 255 255 / 0.2);font-size:15px;letter-spacing:-0.02em;max-width:calc(100vw - 32px)}
.notice.show{display:flex}
.notice button{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgb(255 255 255 / 0.75);background:transparent;font-size:15px;cursor:pointer}
.notice button:hover,.notice button:focus-visible{background:#fff;color:#0b1a26}

@media (max-width:900px){
  header{padding:calc(24px + env(safe-area-inset-top)) 24px 24px}
  .meta{font-size:14px;gap:22px;margin-left:34px}
  .try{width:116px;height:36px;font-size:14px}
  .cell{font-size:clamp(17px, 2.5vw, 24px)}
}
@media (max-width:700px){
  header{padding-left:18px;padding-right:18px}
  .logo svg{height:21px}
  .meta{font-size:12px}
  .meta .m2{display:none}
  .try{width:92px;height:34px;font-size:13px}
  .try::after{content:"";position:absolute;inset:-6px -10px}
  .hero h1{top:34%;width:calc(100vw - 40px);font-size:clamp(48px,14vw,64px);line-height:.88;white-space:normal}
  .hero p{top:22%;width:calc(100vw - 44px);font-size:14px}
  .controller{top:53%;width:calc(100vw - 40px);height:156px}
  .track{top:0;height:156px;border-radius:28px}
  .cells{grid-template-columns:1fr 1fr;grid-template-rows:48px 54px 54px}
  .cell.label{grid-column:1 / -1;border-bottom:1px solid rgb(255 255 255 / 0.12)}
  .cell{font-size:17px}
  button.cell{border-radius:0}
  button.cell[data-i="1"],button.cell[data-i="3"]{border-right:1px solid rgb(255 255 255 / 0.12)}
  button.cell[data-i="1"],button.cell[data-i="2"]{border-bottom:1px solid rgb(255 255 255 / 0.12)}
  button.cell:active{background:rgb(255 255 255 / 0.08)}
  button.cell:focus-visible{outline-offset:-3px}
  .capsule{opacity:0;pointer-events:none}
  .controller.collapsed .capsule{opacity:1;left:50%;top:4vh;top:4dvh;transform:translate(-50%,-50%);width:196px;height:64px;border-radius:999px;background-color:rgb(246 251 255 / 0.18)}
  .controller.collapsed .track{left:calc(50% - 96px);width:192px;top:calc(4vh - 28px);top:calc(4dvh - 28px);height:56px;border-radius:999px}
  .controller.collapsed .cell:not(.chosen){border-color:transparent}
  .controller.highlighting .cell.label{opacity:1}
}
@media (max-width:700px) and (max-height:700px){
  .controller{top:50%}
  .hero p{top:20%;width:calc(100vw - 32px);font-size:13px}
}
@media (max-height:520px) and (orientation:landscape){
  .hero h1{top:20%;font-size:clamp(34px,8vh,56px)}
  .controller{top:50%}
  .hero p{top:auto;bottom:8px;font-size:13px}
}
@media (max-width:700px) and (max-height:520px) and (orientation:landscape){
  .hero h1{top:12%;font-size:clamp(28px,7vh,44px)}
  .controller{top:46%;height:118px}
  .track{height:118px}
  .cells{grid-template-rows:36px 41px 41px}
  .cell{font-size:15px}
  .hero p{bottom:6px;font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  .capsule,.track,.cell,.hero h1 span,.try,.cell.chosen .txt,.controller.collapsed .capsule,.controller.track-fade .track,.controller.restoring .cell:not(.chosen){transition-duration:1ms !important;transition-delay:0s !important}
  .cell.is-reset .txt{animation-duration:1ms}
  .stage.title-hidden .hero h1 span,.controller.collapsed .cell:not(.chosen),.cell.chosen.fading .txt{filter:none}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <video class="media" id="v1f" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v1r" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v2f" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v2r" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v3f" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v3r" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v4f" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v4r" src="https://guttix1.github.io/Digital-flyer-/valley-meats-mesa/clips/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

  <div class="hero">
    <h1><span>Elige</span> <span>tu</span> <span>antojo</span></h1>
    <p>Cambia el lugar, la luz o el platillo, o llena la mesa. Comida de Valley Meats, La Carnicería, en Carbondale.</p>
  </div>

  <div class="controller" id="controller" role="group" aria-label="Controlador de escena">
    <div class="glass track" aria-hidden="true"></div>
    <div class="glass capsule" aria-hidden="true"></div>
    <div class="cells">
      <div class="cell label" data-i="0">Elige&nbsp;→</div>
      <button class="cell" type="button" data-i="1" data-key="scene" disabled><span class="txt">Lugar</span></button>
      <button class="cell" type="button" data-i="2" data-key="light" disabled><span class="txt">Luz</span></button>
      <button class="cell" type="button" data-i="3" data-key="colorway" disabled><span class="txt">Platillo</span></button>
      <button class="cell" type="button" data-i="4" data-key="fullLook" disabled><span class="txt">Mesa</span></button>
    </div>
  </div>

  <header>
    <div class="brand">
      <a class="logo" href="#" aria-label="Valley Meats inicio">
        <svg viewBox="0 0 172 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <text x="0" y="25" fill="#fff" font-family="Manrope, system-ui, sans-serif" font-weight="700" font-size="25" letter-spacing="-1">Valley Meats</text>
        </svg>
      </a>
      <div class="meta"><span class="m1">La Carnicería</span><span class="m2">Carbondale, CO</span></div>
    </div>
    <a class="try" href="#ordenar" target="_blank" rel="noopener noreferrer">Ordenar</a>
  </header>

  <div class="sr" id="status" role="status" aria-live="polite"></div>
  <div class="notice" id="notice" role="alert"><span id="noticeText">No se pudo cargar el video.</span><button type="button" id="retry">Reintentar</button></div>
</main>

<script>
(function(){
  'use strict';
  var HOLD_DEFAULT=0.08;
  var FIRST_FRAME_TIMEOUT=12000;
  var CLIPS={
    scene:   {fwd:'v2f',rev:'v2r',label:'Lugar',   name:'el lugar',     guard:{fwd:HOLD_DEFAULT,rev:0.18}},
    light:   {fwd:'v3f',rev:'v3r',label:'Luz',     name:'la luz',       guard:{fwd:HOLD_DEFAULT,rev:HOLD_DEFAULT}},
    colorway:{fwd:'v1f',rev:'v1r',label:'Platillo',name:'el platillo',  guard:{fwd:HOLD_DEFAULT,rev:HOLD_DEFAULT}},
    fullLook:{fwd:'v4f',rev:'v4r',label:'Mesa',    name:'la mesa llena',guard:{fwd:HOLD_DEFAULT,rev:HOLD_DEFAULT}}
  };
  var stage=document.getElementById('stage');
  var ctrl=document.getElementById('controller');
  var statusEl=document.getElementById('status');
  var notice=document.getElementById('notice');
  var noticeText=document.getElementById('noticeText');
  var retryBtn=document.getElementById('retry');
  var buttons=[].slice.call(ctrl.querySelectorAll('button.cell'));
  var V={};['v1f','v1r','v2f','v2r','v3f','v3r','v4f','v4r'].forEach(function(id){V[id]=document.getElementById(id)});

  // refs (no re-render per frame)
  var R={scene:'base',playback:'loading',direction:'forward',locked:false,token:0,visible:null,chosen:null,ready:{},capIndex:0,pending:null,lastRequest:null};

  function announce(msg){statusEl.textContent='';setTimeout(function(){statusEl.textContent=msg},30)}
  function btnFor(key){for(var i=0;i<buttons.length;i++)if(buttons[i].getAttribute('data-key')===key)return buttons[i];return null}
  function pairReady(key){var c=CLIPS[key];return !!(R.ready[c.fwd]&&R.ready[c.rev])}

  // ---------- capsule positions (custom properties only)
  var POS=[['-5px','calc(20% + 5px)'],['20%','20%'],['40%','20%'],['60%','20%'],['80%','calc(20% + 5px)']];
  var capsule=ctrl.querySelector('.capsule');
  function setCap(i){R.capIndex=i;capsule.style.setProperty('--cap-left',POS[i][0]);capsule.style.setProperty('--cap-width',POS[i][1]);ctrl.classList.toggle('highlighting',i>0)}
  function focusedOption(){var a=document.activeElement;return buttons.indexOf(a)>=0&&!a.disabled?a:null}
  function canHighlight(){return !ctrl.classList.contains('collapsed')}
  buttons.forEach(function(b){
    b.addEventListener('pointerenter',function(){if(canHighlight())setCap(+b.getAttribute('data-i'))});
    b.addEventListener('focus',function(){if(canHighlight())setCap(+b.getAttribute('data-i'))});
    b.addEventListener('blur',function(){if(canHighlight()&&!ctrl.matches(':hover'))setCap(0)});
    b.addEventListener('click',function(){onButton(b)});
  });
  ctrl.addEventListener('pointerleave',function(){if(!canHighlight())return;var f=focusedOption();setCap(f?+f.getAttribute('data-i'):0)});
  ctrl.addEventListener('pointermove',function(e){var r=ctrl.getBoundingClientRect();if(!r.width)return;
    ctrl.style.setProperty('--glass-x',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');ctrl.style.setProperty('--glass-y',((e.clientY-r.top)/r.height*100).toFixed(1)+'%')});

  // ---------- control semantics
  function setOptionState(b,on){b.disabled=!on;if(on){b.removeAttribute('aria-hidden');b.removeAttribute('tabindex')}else{b.setAttribute('aria-hidden','true');b.setAttribute('tabindex','-1')}}
  function refreshControls(){
    buttons.forEach(function(b){var key=b.getAttribute('data-key');
      if(R.locked){b.disabled=true;if(R.scene!=='base'&&b===R.chosen){b.removeAttribute('aria-hidden')}else if(R.scene!=='base'){b.setAttribute('aria-hidden','true');b.setAttribute('tabindex','-1')}return}
      if(R.scene==='base'){setOptionState(b,!!R.visible&&pairReady(key))}
      else{setOptionState(b,b===R.chosen)}
    });
  }
  function lockAll(){R.locked=true;buttons.forEach(function(b){b.disabled=true})}

  // ---------- readiness
  function markReady(id){if(R.ready[id])return;R.ready[id]=true;if(id==='v1f')showBase();refreshControls()}
  Object.keys(V).forEach(function(id){var v=V[id];
    if(v.readyState>=2)markReady(id);
    v.addEventListener('loadeddata',function(){if(v.readyState>=2)markReady(id)});
    v.addEventListener('error',function(){if(id==='v1f'&&!R.visible){R.playback='error';showError('No se pudo cargar la escena.',function(){location.reload()})}});
  });
  function showBase(){if(R.visible)return;var v=V.v1f;v.pause();
    var done=function(){if(R.visible)return;v.classList.add('is-visible');R.visible=v;R.playback='ready';announce('Escena lista. Elige lugar, luz, platillo o mesa.');refreshControls()};
    if(v.currentTime>0.001){v.addEventListener('seeked',function h(){v.removeEventListener('seeked',h);done()});v.currentTime=0}else done()}
  R.playback='loading';announce('Cargando la escena.');

  // ---------- notice
  var retryFn=null;
  function showError(msg,fn){noticeText.textContent=msg;retryFn=fn;notice.classList.add('show');announce(msg)}
  function hideError(){notice.classList.remove('show');retryFn=null}
  retryBtn.addEventListener('click',function(){var f=retryFn;hideError();if(f)f()});

  // ---------- seam-safe player
  function rewind(v,token){return new Promise(function(res){v.pause();if(v.currentTime<=0.001){res();return}
    var h=function(){v.removeEventListener('seeked',h);res()};v.addEventListener('seeked',h);v.currentTime=0})}

  function playClip(v,guard,opts){
    var token=R.token;
    var cleanups=[];function cleanup(){while(cleanups.length){try{cleanups.pop()()}catch(e){}}}
    return rewind(v,token).then(function(){
      if(token!==R.token)throw new Error('stale');
      // first-frame wait (registered BEFORE play)
      var frameP=new Promise(function(resolve,reject){
        var settled=false;function ok(){if(settled||token!==R.token)return;settled=true;resolve()}
        function fail(e){if(settled)return;settled=true;reject(e)}
        // pausable deadline
        var remaining=FIRST_FRAME_TIMEOUT,startedAt=0,timer=null;
        function arm(){startedAt=Date.now();timer=setTimeout(function(){fail(new Error('timeout'))},remaining)}
        function disarm(){if(timer){clearTimeout(timer);timer=null;remaining-=Date.now()-startedAt}}
        function onVis(){if(settled)return;if(document.hidden){disarm();v.pause();try{v.currentTime=0}catch(e){}}else{arm();var p=v.play();if(p&&p.catch)p.catch(function(e){fail(e)})}}
        document.addEventListener('visibilitychange',onVis);cleanups.push(function(){document.removeEventListener('visibilitychange',onVis);disarm()});
        if(!document.hidden)arm();
        if(typeof v.requestVideoFrameCallback==='function'){
          var handle=null;
          var cb=function(now,meta){handle=null;if(settled||token!==R.token)return;
            if(meta&&meta.mediaTime<=0.5&&v.readyState>=2)ok();else handle=v.requestVideoFrameCallback(cb)};
          handle=v.requestVideoFrameCallback(cb);
          cleanups.push(function(){if(handle!=null&&v.cancelVideoFrameCallback)v.cancelVideoFrameCallback(handle)});
        }else{
          var raf=null;
          var tick2=function(){raf=requestAnimationFrame(function(){raf=requestAnimationFrame(function(){raf=null;if(settled||token!==R.token)return;
            if(v.readyState>=2&&!v.paused&&v.currentTime<=0.5)ok();else tick2()})})};
          var onPlaying=function(){tick2()};
          v.addEventListener('playing',onPlaying);
          cleanups.push(function(){v.removeEventListener('playing',onPlaying);if(raf)cancelAnimationFrame(raf)});
        }
      });
      var playP;try{playP=v.play()}catch(e){playP=Promise.reject(e)}
      if(!playP||typeof playP.then!=='function')playP=Promise.resolve();
      return Promise.all([playP,frameP]).then(function(){cleanup()},function(e){cleanup();throw e});
    }).then(function(){
      if(token!==R.token)throw new Error('stale');
      // atomic reveal
      var prev=R.visible;v.classList.add('is-visible');if(prev&&prev!==v){prev.classList.remove('is-visible');prev.pause()}R.visible=v;
      if(opts&&opts.onReveal)opts.onReveal();
      // monitor active clip to terminal hold
      return new Promise(function(resolve){
        var done=false,raf=null;
        function finish(){if(done||token!==R.token)return;done=true;if(raf)cancelAnimationFrame(raf);v.removeEventListener('ended',onEnded);v.pause();resolve()}
        function onEnded(){finish()}
        v.addEventListener('ended',onEnded);
        (function loop(){raf=requestAnimationFrame(function(){if(done||token!==R.token){v.removeEventListener('ended',onEnded);return}
          var d=v.duration;if(opts&&opts.onProgress&&isFinite(d))opts.onProgress(v.currentTime,d);
          if(isFinite(d)&&d>0&&v.currentTime>=d-guard)finish();else loop()})})();
      });
    },function(e){v.pause();if(v!==R.visible)v.classList.remove('is-visible');throw e});
  }

  // ---------- transitions
  function onButton(b){
    if(R.locked)return;
    var key=b.getAttribute('data-key');
    if(R.scene==='base')forward(key,b);
    else if(b===R.chosen)reverse(key,b);
  }

  function chosenTarget(b){
    var prevT=b.style.transition,prevX=b.style.transform;b.style.transition='none';b.style.transform='';
    var cr=ctrl.getBoundingClientRect(),br=b.getBoundingClientRect();
    b.style.transform=prevX;void b.offsetWidth;b.style.transition=prevT;
    var mobile=window.matchMedia('(max-width:700px)').matches;
    var cx=cr.left+cr.width/2;
    var cy=mobile?cr.top+(window.visualViewport?window.visualViewport.height:window.innerHeight)*0.04:cr.top+35;
    return {dx:cx-(br.left+br.width/2),dy:cy-(br.top+br.height/2)};
  }

  function forward(key,b){
    if(R.locked||R.scene!=='base'||!pairReady(key))return;
    var hadFocus=document.activeElement===b;
    lockAll();R.token++;var token=R.token;
    R.direction='forward';R.playback='starting';R.chosen=b;R.lastRequest={dir:'forward',key:key,b:b};hideError();
    var c=CLIPS[key];var v=V[c.fwd];
    // collapse + rear fade in the SAME style recalc
    var t=chosenTarget(b);
    b.classList.add('chosen');ctrl.classList.remove('restoring','highlighting');
    ctrl.classList.add('collapsed','track-fade');
    b.style.transform='translate('+t.dx.toFixed(1)+'px,'+t.dy.toFixed(1)+'px)';
    if(hadFocus)b.focus({preventScroll:true});
    announce('Cambiando '+c.name+'.');
    var titleHidden=false;
    playClip(v,c.guard.fwd,{
      onReveal:function(){R.playback='playing'},
      onProgress:function(ct,d){if(!titleHidden&&ct>=Math.min(d*0.12,0.9)){titleHidden=true;stage.classList.add('title-hidden')}}
    }).then(function(){
      if(token!==R.token)return;
      stage.classList.add('title-hidden');
      R.scene=key;R.playback='ready';R.locked=false;
      var txt=b.querySelector('.txt');txt.textContent='Regresar';b.classList.add('is-reset');
      b.setAttribute('aria-label','Regresar a la escena inicial');
      refreshControls();
      if(hadFocus||document.activeElement===document.body)b.focus({preventScroll:true});
      announce('Listo: '+c.name+'. Toca Regresar para volver.');
    },function(e){
      if(token!==R.token||(e&&e.message==='stale'))return;
      R.playback='error';
      // back to base UI; last valid frame is still visible
      R.locked=false;R.scene='base';expandUI(b,false);
      refreshControls();
      if(hadFocus)b.focus({preventScroll:true});
      showError('No se pudo reproducir '+c.name+'.',function(){forward(key,b)});
    });
  }

  function expandUI(b,restoring){
    ctrl.classList.toggle('restoring',!!restoring);
    ctrl.classList.remove('collapsed','track-fade');
    b.style.transform='';
    var f=focusedOption();setCap(f?+f.getAttribute('data-i'):0);
  }

  function reverse(key,b){
    if(R.locked||R.scene!==key)return;
    var hadFocus=document.activeElement===b;
    lockAll();R.token++;var token=R.token;
    R.direction='reverse';R.playback='starting';R.lastRequest={dir:'reverse',key:key,b:b};hideError();
    var c=CLIPS[key];var v=V[c.rev];
    if(hadFocus)b.focus({preventScroll:true});
    // parallel: start reverse clip AND expand the bar
    b.classList.add('fading');
    var swapTimer=setTimeout(function(){if(token!==R.token)return;
      var txt=b.querySelector('.txt');txt.textContent=c.label;b.classList.remove('is-reset','fading','chosen');b.removeAttribute('aria-label')},260);
    expandUI(b,true);
    announce('Regresando a la escena inicial.');
    playClip(v,c.guard.rev,{onReveal:function(){R.playback='playing'}}).then(function(){
      if(token!==R.token)return;
      clearTimeout(swapTimer);
      var txt=b.querySelector('.txt');txt.textContent=c.label;b.classList.remove('is-reset','fading','chosen');b.removeAttribute('aria-label');
      R.scene='base';R.chosen=null;R.playback='ready';R.locked=false;
      stage.classList.remove('title-hidden');ctrl.classList.remove('restoring');
      refreshControls();
      if(hadFocus||document.activeElement===document.body)b.focus({preventScroll:true});
      announce('Escena inicial. Elige lugar, luz, platillo o mesa.');
    },function(e){
      if(token!==R.token||(e&&e.message==='stale'))return;
      clearTimeout(swapTimer);
      R.playback='error';
      // still on the selected frame: restore selected UI
      var t=chosenTarget(b);
      b.classList.add('chosen','is-reset');b.classList.remove('fading');b.querySelector('.txt').textContent='Regresar';
      ctrl.classList.remove('restoring');ctrl.classList.add('collapsed','track-fade');
      b.style.transform='translate('+t.dx.toFixed(1)+'px,'+t.dy.toFixed(1)+'px)';
      R.locked=false;refreshControls();
      if(hadFocus)b.focus({preventScroll:true});
      showError('No se pudo regresar a la escena inicial.',function(){reverse(key,b)});
    });
  }

  // keep the selected label centred on resize
  window.addEventListener('resize',function(){
    if(R.chosen&&ctrl.classList.contains('collapsed')){var b=R.chosen;b.style.transition='none';b.style.transform='';var t=chosenTarget(b);
      b.style.transform='translate('+t.dx.toFixed(1)+'px,'+t.dy.toFixed(1)+'px)';void b.offsetWidth;b.style.transition=''}
  });
  setCap(0);refreshControls();
})();
</script>
</body>
</html>
