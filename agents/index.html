<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#17171a;--dim:#77777d;--soft:#f3f3f1;--line:rgba(0,0,0,.09);--red:#e5432d;--top:calc(max(10px,env(safe-area-inset-top)) + 44px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.feed{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--bg)}
/* barra de arriba */
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 0;background:#fff;border-bottom:1px solid var(--line)}
.top b{font-weight:700;font-size:19px}
.top span{margin-left:auto;padding:6px 11px;border-radius:12px;background:var(--red);color:#fff;font-weight:600;font-size:13.5px}
.rail{position:fixed;z-index:20;right:5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px}
.rail i{display:block;width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.18)}.rail i.on{height:20px;background:var(--ink)}.rail i.need{background:var(--red)}
/* intro */
.intro{display:flex;flex-direction:column;align-items:center;padding:calc(var(--top) + 14px) 20px calc(18px + env(safe-area-inset-bottom))}
.intro .eye{width:min(62vw,300px);margin-top:4px}
.intro h1{font-weight:700;font-size:clamp(34px,10vw,52px);line-height:1;margin-top:6px;text-align:center}
.intro .sub{color:var(--dim);font-size:16px;margin-top:6px;text-align:center}
.who{width:100%;max-width:440px;margin-top:16px}
.who button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:17px;font-weight:500}
.who .dot{width:30px;height:30px;border-radius:50%;flex:none}
.who em{margin-left:auto;font-style:normal;font-weight:600;font-size:13px;padding:4px 9px;border-radius:10px;background:var(--soft);color:var(--dim)}
.who em.n{background:var(--red);color:#fff}.who em.r{background:var(--ink);color:#fff}
.hint{margin-top:auto;color:var(--dim);font-size:14px;font-weight:500}
/* tarjeta de agente */
.ag{--c:#888}
.meta{position:absolute;z-index:6;top:calc(var(--top) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--dim)}
.tabs{position:absolute;z-index:7;top:calc(var(--top) + 28px);left:16px;right:16px;display:flex;border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;font-size:15px}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c)}
.tabs button b{display:inline-block;min-width:19px;height:19px;margin-left:4px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:19px;font-weight:600}
.strip{position:absolute;top:calc(var(--top) + 72px);left:0;right:0;bottom:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;height:100%;scroll-snap-align:start;overflow-y:auto;padding:6px 20px calc(24px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-direction:column;align-items:center}
.hero .eye{width:min(50vw,230px);cursor:pointer;touch-action:manipulation}
.hero h2{font-weight:700;font-size:clamp(36px,11vw,56px);line-height:1;margin-top:2px}
.chip{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:11px;font-weight:600;font-size:13.5px;color:#fff}
.lbl{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
.needs li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:#fdecea;color:#5a1a12;font-size:16.5px;line-height:1.3;font-weight:500}
.needs li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;line-height:26px;text-align:center;font-weight:600}
.clear{padding:14px;border-radius:16px;background:var(--soft);color:var(--dim);font-size:16px}
.mini{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.mini i{width:34px;height:34px;border-radius:50%;flex:none}
.mini h3{font-weight:700;font-size:28px}
.now{font-size:21px;line-height:1.3;font-weight:500;margin-top:6px}
.steps li{list-style:none;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16.5px;line-height:1.3}
.steps li:first-child{border-top:0}
.steps li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;line-height:24px;text-align:center;font-weight:600}
.steps.next li::before{content:"→";background:var(--soft);color:var(--ink)}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:16.5px}
.facts div:first-child{border-top:0}
.facts dt{color:var(--dim)}.facts dd{font-weight:600;text-align:right}
.btn{display:block;margin-top:16px;padding:15px;border-radius:16px;background:var(--ink);color:#fff;text-align:center;font-weight:600;font-size:16px;text-decoration:none}
.note{margin-top:14px;color:var(--dim);font-size:13px;line-height:1.4}
.say{position:fixed;z-index:9;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(320px,84vw);padding:10px 15px;border-radius:18px;background:var(--ink);color:#fff;font-size:15.5px;line-height:1.3;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.say.on{opacity:1}
@media (prefers-reduced-motion:reduce){.say{transition:none}}
</style>
</head>
<body>
<div class="feed" id="feed"></div>
<header class="top"><b>Agents</b><span id="pk"></span></header>
<nav class="rail" id="rail" aria-hidden="true"></nav>
<div class="say" id="say"></div>
<script>
/* Agentes y su estado real de hoy. Demo: nada corre solo todavía. */
const AG=[
 {id:'flyers',name:'Flyers',color:'#ff5a36',st:'needs',
  needs:['Real matchups when the program comes out','Real horse photos for the 12 races','Track social media links and exact location'],
  now:'The Gran Maturity G2 race page is live. People can scroll the races, pick winners and see the ads.',
  done:['12 race cards with Equipo and Análisis','Mis picks, full-screen photos, white design','Directions, WhatsApp and social icons','CAOS and Valley Meats video ads'],
  next:['Swap in real matchups and photos','Scoreboard after the races'],
  facts:[['Event','Sat Oct 31, Calpulalpan'],['Gran Final','Sat Nov 28'],['Cuadras','23'],['Site','Public, hidden from Google']],
  link:['Open Gran Maturity G2','../events/gran-maturity-g2-oct31/']},
 {id:'ads',name:'Ads',color:'#ffb000',st:'needs',
  needs:['The CAOS hat special and its price','Your final CAOS logo file'],
  now:'Two video ads are running inside the race page.',
  done:['CAOS hat video ad (after race 4)','Valley Meats video from your poster (after race 8)','HipIQ price-guess videos in English and Spanish'],
  next:['Real CAOS special on the ad','Order link for Valley Meats once ordering is live'],
  facts:[['Ads in race page','2'],['Tap an ad','Opens the full video or poster'],['Valley Meats phone','970-704-9614']]},
 {id:'hipiq',name:'HipIQ',color:'#18a873',st:'run',
  needs:['Fall sale photos (after Oct 30)','OK to remove the last 3 AI-looking details'],
  now:'Price guesses for the Heritage Place Fall Mixed Sale.',
  done:['Sort from cheapest to highest','Price guesses section with how close it lands','Removed the generic AI look'],
  next:['Add photos when they come out','Check guesses against real results after Nov 7'],
  facts:[['Sale','Nov 5 to 7'],['Photos','After Oct 30'],['Results','After Nov 7'],['Online','Not yet']]},
 {id:'valley',name:'Valley Meats',color:'#c62828',st:'needs',
  needs:['The real menu, prices and hours','A working way to receive orders (text, email or POS)'],
  now:'The voice ordering site is built and tested, but only with test data.',
  done:['Ordering and checkout that reads the order back first','Swipe menu','Design cleanup'],
  next:['Load the real menu','Go live and print the QR'],
  facts:[['Address','774 State Route 133, Carbondale'],['Phone','970-704-9614'],['Payment','In person or a secure link, never by voice'],['Online ordering','Not live yet']]},
 {id:'results',name:'Results',color:'#2f6fe8',st:'idle',
  needs:['Your OK: picks lock when each race starts','The tiebreak rule','A small server so everyone\'s picks are collected'],
  now:'Not started. Right now picks are only saved on each person\'s phone.',
  done:[],
  next:['Admin page where you tap each winner','Scoreboard everyone can see'],
  facts:[['Picks today','Saved on each phone'],['Needs','A server to collect picks']]},
 {id:'caos',name:'CAOS',color:'#2a2a2e',st:'idle',
  needs:['Final CAOS logo file','Which shirt ideas you like'],
  now:'Waiting to start the shirt designs.',
  done:['Hat video placed in the race page'],
  next:['Original shirt art (not copied)'],
  facts:[['Brand line','Built different · Run different'],['Products','Hats now, shirts next']]},
];
const ST={needs:['needs you','#e5432d'],run:['working','#17171a'],idle:['not started','#9a9aa0']};
const $=s=>document.querySelector(s);const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const mix=(a,b,t)=>a.map((v,i)=>Math.round(lerp(v,b[i],t)));const css=c=>`rgb(${c})`;
const shade=(h,k)=>css(k<0?mix(hex(h),[0,0,0],-k):mix(hex(h),[255,255,255],k));
const totalNeeds=AG.reduce((n,a)=>n+(a.st==='idle'&&!a.needs.length?0:a.needs.length),0);
const needAg=AG.filter(a=>a.needs.length).length;

/* ---------- personaje: burbuja con ojo ---------- */
let EID=0;
function eyeSVG(o){const k=EID++;const ball=!!o.ball;
 const ex=200,ey=ball?200:188,er=ball?150:88,ir=ball?74:50,lid=ball?'#fff':o.color;
 let fib='';for(let i=0;i<48;i++){const a=i/48*Math.PI*2,r1=ir*.44,r2=ir*.9;fib+=`<line x1="${(Math.cos(a)*r1).toFixed(1)}" y1="${(Math.sin(a)*r1).toFixed(1)}" x2="${(Math.cos(a)*r2).toFixed(1)}" y2="${(Math.sin(a)*r2).toFixed(1)}" stroke="${i%2?'#fff':'#000'}" stroke-opacity=".28" stroke-width="${i%3?1.3:2}" stroke-linecap="round"/>`}
 const irisC=ball?'#e8962a':(o.color==='#2a2a2e'?'#6b6b73':o.color);
 return `<svg class="eye" viewBox="0 0 400 430" data-k="${k}" data-ex="${ex}" data-ey="${ey}" data-er="${er}" data-mr="${ball?62:34}">
 <defs><radialGradient id="bd${k}" cx=".38" cy=".3" r=".78"><stop offset="0" stop-color="${ball?'#fff':shade(o.color,.42)}"/><stop offset=".6" stop-color="${ball?'#f2f3f5':o.color}"/><stop offset="1" stop-color="${ball?'#c3c8d0':shade(o.color,-.38)}"/></radialGradient>
 <radialGradient id="ew${k}" cx=".42" cy=".36" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".8" stop-color="#f1f2f4"/><stop offset="1" stop-color="#cfd3da"/></radialGradient>
 <radialGradient id="ir${k}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${shade(irisC,.45)}"/><stop offset=".55" stop-color="${irisC}"/><stop offset=".86" stop-color="${shade(irisC,-.3)}"/><stop offset="1" stop-color="${shade(irisC,-.6)}"/></radialGradient>
 <radialGradient id="gn${k}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="cp${k}"><circle cx="${ex}" cy="${ey}" r="${er}"/></clipPath></defs>
 <ellipse class="sh" cx="200" cy="405" rx="115" ry="15" fill="url(#gn${k})"/>
 <g class="bd"><circle cx="200" cy="200" r="150" fill="url(#bd${k})"/>
  ${ball?'':`<circle cx="${ex}" cy="${ey}" r="${er}" fill="url(#ew${k})"/>`}
  <g clip-path="url(#cp${k})"><g class="ir"><circle r="${ir}" fill="url(#ir${k})"/>${fib}<circle r="${ir}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="${ball?5:4}"/>
   <circle class="pu" r="${ir*.36}" fill="#0d0d10"/><ellipse cx="${-ir*.3}" cy="${-ir*.35}" rx="${ir*.2}" ry="${ir*.15}" fill="#fff" opacity=".92" transform="rotate(-30 ${-ir*.3} ${-ir*.35})"/><circle cx="${ir*.28}" cy="${ir*.28}" r="${ir*.07}" fill="#fff" opacity=".7"/></g>
   <ellipse class="lt" cx="${ex}" cy="${ey-er-er*1.15}" rx="${er*1.45}" ry="${er*1.15}" fill="${lid}"/><ellipse class="lb" cx="${ex}" cy="${ey+er+er*1.15}" rx="${er*1.45}" ry="${er*1.15}" fill="${lid}"/></g>
  <ellipse cx="135" cy="105" rx="62" ry="36" fill="#fff" opacity="${ball?.7:.38}" transform="rotate(-35 135 105)"/>
  <path d="M90 275 A150 150 0 0 0 310 275" fill="none" stroke="#fff" stroke-opacity="${ball?.55:.25}" stroke-width="7" stroke-linecap="round"/></g></svg>`}

/* ---------- tarjetas ---------- */
const feed=$('#feed');
const dotBg=c=>`radial-gradient(circle at 38% 32%,${shade(c,.42)},${c} 60%,${shade(c,-.38)})`;
let html=`<section class="card intro" id="intro">${eyeSVG({ball:true})}
 <h1>Your agents</h1><p class="sub">${AG.length} agents · ${totalNeeds} things need you</p>
 <div class="who">${AG.map((a,i)=>`<button data-go="${i}"><i class="dot" style="background:${dotBg(a.color)}"></i>${a.name}<em class="n">${a.needs.length} need you</em></button>`).join('')}</div>
 <p class="hint">Scroll up for each agent ↑</p></section>`;
html+=AG.map((a,i)=>{const [lbl,col]=ST[a.st];const li=(x,cls)=>x.length?`<ul class="${cls}">${x.map(t=>`<li>${t}</li>`).join('')}</ul>`:`<p class="clear">Nothing yet</p>`;
 return `<section class="card ag" style="--c:${a.color}" data-i="${i}">
 <div class="meta"><span>Agent ${i+1} of ${AG.length}</span><span>${lbl}</span></div>
 <div class="tabs"><button class="on">Needs${a.needs.length?`<b>${a.needs.length}</b>`:''}</button><button>Doing</button><button>Important</button></div>
 <div class="strip">
  <div class="panel"><div class="hero">${eyeSVG({color:a.color})}<h2>${a.name}</h2><span class="chip" style="background:${col}">${lbl}</span></div>
   <p class="lbl">Needs from you</p>${a.needs.length?`<ul class="needs">${a.needs.map((t,j)=>`<li><b>${j+1}</b><span>${t}</span></li>`).join('')}</ul>`:'<p class="clear">Nothing right now</p>'}</div>
  <div class="panel"><div class="mini"><i style="background:${dotBg(a.color)}"></i><h3>${a.name}</h3></div>
   <p class="lbl">Doing now</p><p class="now">${a.now}</p>
   <p class="lbl">Done</p>${li(a.done,'steps')}
   <p class="lbl">Up next</p>${li(a.next,'steps next')}</div>
  <div class="panel"><div class="mini"><i style="background:${dotBg(a.color)}"></i><h3>${a.name}</h3></div>
   <p class="lbl">Important</p><dl class="facts">${a.facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
   ${a.link?`<a class="btn" href="${a.link[1]}">${a.link[0]}</a>`:''}
   <p class="note">Demo board with today's real status. Tell Claude in the chat to put this agent to work.</p></div>
 </div></section>`}).join('');
feed.innerHTML=html;
$('#pk').textContent=`${totalNeeds} things need you`;

/* tabs + deslizar */
document.querySelectorAll('.ag').forEach(c=>{const strip=c.querySelector('.strip'),tabs=[...c.querySelectorAll('.tabs button')];
 tabs.forEach((t,i)=>t.addEventListener('click',()=>strip.scrollTo({left:i*strip.clientWidth,behavior:'smooth'})));
 let raf;strip.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=Math.round(strip.scrollLeft/strip.clientWidth);tabs.forEach((t,j)=>t.classList.toggle('on',i===j))})},{passive:true})});
const cards=[...feed.querySelectorAll('.card')];
const goCard=el=>feed.scrollTo({top:el.offsetTop,behavior:'smooth'});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goCard(cards[+b.dataset.go+1])));
$('#pk').addEventListener('click',()=>{const i=AG.findIndex(a=>a.st==='needs');goCard(cards[i+1])});
const railEl=$('#rail');railEl.innerHTML=cards.map((c,j)=>`<i class="${j&&AG[j-1].needs.length?'need':''}"></i>`).join('');
let cur=0;function rail(){cur=Math.round(feed.scrollTop/innerHeight);[...railEl.children].forEach((m,j)=>m.classList.toggle('on',cur===j))}
feed.addEventListener('scroll',rail,{passive:true});rail();

/* ---------- globo ---------- */
let sayT;function say(t,ms=3000){const s=$('#say');s.textContent=t;s.classList.add('on');clearTimeout(sayT);sayT=setTimeout(()=>s.classList.remove('on'),ms)}

/* ---------- ojos vivos ---------- */
const eyes=[...document.querySelectorAll('svg.eye')].map(svg=>({svg,card:svg.closest('.card'),ir:svg.querySelector('.ir'),puEl:svg.querySelector('.pu'),lt:svg.querySelector('.lt'),lb:svg.querySelector('.lb'),bd:svg.querySelector('.bd'),sh:svg.querySelector('.sh'),
 ex:+svg.dataset.ex,ey:+svg.dataset.ey,er:+svg.dataset.er,mr:+svg.dataset.mr,irR:+svg.querySelector('.ir circle').getAttribute('r'),
 gx:0,gy:0,vx:0,vy:0,tx:0,ty:0,sq:1,sv:0,pu0:.36,pu:.36,put:.36,happy:0,happyT:0,lid:0,blink:-1,nb:1+Math.random()*3,ns:0}));
let ptr=null,lastPtr=-1e9;
addEventListener('pointermove',e=>{ptr={x:e.clientX,y:e.clientY};lastPtr=performance.now()},{passive:true});
addEventListener('pointerdown',e=>{ptr={x:e.clientX,y:e.clientY};lastPtr=performance.now()},{passive:true});
eyes.forEach(E=>E.svg.addEventListener('click',()=>{E.sv-=.1;E.put=.48;E.happyT=1;setTimeout(()=>{E.put=E.pu0;E.happyT=0},1300);
 const ci=cards.indexOf(E.card);if(ci===0){say(`${totalNeeds} things need you. Scroll to see each agent.`);return}
 const a=AG[ci-1];say(a.needs.length?`I need ${a.needs.length} thing${a.needs.length>1?'s':''} from you. Swipe to see what I'm doing.`:`All good here. Swipe to see my work.`)}));
let t0=performance.now(),last=t0;
function step(E,dt,T,now){
 const r=E.svg.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth)return;
 const sc=r.width/400,cx=r.left+E.ex*sc,cy=r.top+E.ey*sc;
 if(ptr&&now-lastPtr<2500){E.tx=(ptr.x-cx)/(E.er*sc*2.6);E.ty=(ptr.y-cy)/(E.er*sc*2.6)}
 else if(T>E.ns){E.ns=T+.9+Math.random()*2.3;E.tx=(Math.random()-.5)*1.3;E.ty=(Math.random()-.5)*.9}
 const m=Math.hypot(E.tx,E.ty);if(m>1){E.tx/=m;E.ty/=m}
 E.vx+=(260*(E.tx-E.gx)-26*E.vx)*dt;E.vy+=(260*(E.ty-E.gy)-26*E.vy)*dt;E.gx+=E.vx*dt;E.gy+=E.vy*dt;
 E.sv+=(-230*(E.sq-1)-9*E.sv)*dt;E.sq+=E.sv*dt;
 E.pu=lerp(E.pu,E.put,dt*7);E.happy=lerp(E.happy,E.happyT,dt*8);
 if(T>E.nb&&E.blink<0){E.blink=0;E.dbl=Math.random()<.25;E.nb=T+2.4+Math.random()*4}
 let b=0;if(E.blink>=0){E.blink+=dt;const D=.15;if(E.blink<D)b=Math.sin(E.blink/D*Math.PI);else if(E.dbl&&E.blink>D+.08&&E.blink<2*D+.08)b=Math.sin((E.blink-D-.08)/D*Math.PI);if(E.blink>(E.dbl?2*D+.1:D))E.blink=-1;b=reduce?0:Math.max(0,b)}
 const gm=Math.min(1,Math.hypot(E.gx,E.gy)),ang=Math.atan2(E.gy,E.gx)*180/Math.PI;
 E.ir.setAttribute('transform',`translate(${E.ex+E.gx*E.mr} ${E.ey+E.gy*E.mr}) rotate(${ang}) scale(${1-.2*gm} 1) rotate(${-ang})`);
 E.puEl.setAttribute('r',(E.irR*E.pu).toFixed(2));
 const ry=E.er*1.15;
 E.lt.setAttribute('cy',((E.ey-E.er)+(E.er+2)*b+E.er*.12*E.lid-ry).toFixed(1));
 E.lb.setAttribute('cy',((E.ey+E.er)-(E.er-2)*b-E.er*.55*E.happy+ry).toFixed(1));
 const bob=reduce?0:Math.sin(T*1.6+E.ex)*6;
 E.bd.setAttribute('transform',`translate(200 ${200+bob}) scale(${1/E.sq} ${E.sq}) translate(-200 -200) translate(${E.gx*5} ${E.gy*4})`);
 E.sh.setAttribute('rx',(115-bob*2).toFixed(1))}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const T=(now-t0)/1000;eyes.forEach(E=>step(E,dt,T,now));requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__ready=true;
</script>
</body>
</html>
